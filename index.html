<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADXROHITBIHAR | App Unlock Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #05050a;
            --bg-card: rgba(13, 15, 26, 0.95);
            --border-neon: rgba(255, 170, 0, 0.4);
            --neon-gold: #ffaa00;
            --neon-green: #00ff66;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --gradient-btn: linear-gradient(135deg, #ffaa00 0%, #ff6600 100%);
        }
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-primary); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: radial-gradient(circle at 50% -20%, #1a1c3a 0%, var(--bg-deep) 70%); 
            font-family: sans-serif; 
        }
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-neon); 
            padding: 30px 25px; 
            border-radius: 20px; 
            text-align: center; 
            max-width: 360px; 
            width: 90%; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); 
            position: relative;
        }
        .logo-container {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 2px solid var(--neon-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 170, 0, 0.1);
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h2 { 
            color: var(--text-primary); 
            margin-bottom: 10px; 
            font-size: 20px;
            letter-spacing: 1px;
        }
        .desc {
            color: var(--text-secondary); 
            font-size: 13px; 
            margin-bottom: 25px; 
            line-height: 1.5;
        }
        .key-input { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            border: 1px solid var(--border-neon); 
            background: rgba(255,255,255,0.03); 
            color: #fff; 
            text-align: center; 
            margin-bottom: 15px; 
            outline: none; 
            box-sizing: border-box;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .key-input::placeholder {
            color: #55607a;
        }
        .btn { 
            padding: 14px; 
            border-radius: 12px; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-bottom: 12px; 
            box-sizing: border-box;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.85;
        }
        .btn-get { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--border-neon); 
            color: var(--text-primary);
        }
        .btn-verify { 
            background: var(--gradient-btn); 
            color: #000;
        }
        .telegram-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .telegram-text a {
            color: var(--neon-gold);
            text-decoration: none;
            font-weight: bold;
        }
        .telegram-text a:hover {
            text-decoration: underline;
        }
        #status-msg { 
            font-size: 13px; 
            margin-top: 5px; 
            margin-bottom: 15px;
            font-weight: bold; 
            min-height: 18px;
        }
        #toast {
            visibility: hidden;
            min-width: 240px;
            background-color: #1a1c3a;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            border: 1px solid var(--border-neon);
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {top: 0; opacity: 0;}
            to {top: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {top: 30px; opacity: 1;}
            to {top: 0; opacity: 0;}
        }
        #mainAppContent { display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="card" id="authScreen">
        <div class="logo-container">
            <img src="https://i.postimg.cc/767wxWNM/750582767-1017528391240334-3988665459253503214-n.webp" alt="Logo" id="appLogo">
        </div>
        
        <h2>DEVICE VERIFICATION</h2>
        <p class="desc">Please enter your access key obtained from Get Key to unlock the portal (24 Hours Validity).</p>
        
        <input type="text" id="accessKeyInput" class="key-input" placeholder="ENTER ACCESS KEY" maxlength="30">
        
        <button class="btn btn-get" onclick="openAroLinks()">
            <i class="fa-solid fa-key" style="color: var(--neon-gold);"></i> Get Key
        </button>
        <button class="btn btn-verify" onclick="verifyUserKey()">
            <i class="fa-solid fa-lock-open"></i> Verify & Open App
        </button>

        <div class="telegram-text">
            Need a key? Join our <a href="https://t.me/+cw7TRotEzcczNThl" target="_blank">Telegram</a>
        </div>

        <div id="status-msg"></div>
    </div>

    <div id="mainAppContent">
        <h1 style="color: var(--neon-green);">Welcome to MADXROHITBIHAR!</h1>
    </div>

    <div id="toast"></div>

    <script>
        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.innerText = text;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function openAroLinks() {
            const apiToken = "828c34db80ec53e94e7174f5f52e0b274a38ab2d";
            const targetUrl = "https://madxrohitbihari.github.io/KYE-SYSTEM-GRENRTED/";
            const apiUrl = `https://arolinks.com/api?api=${apiToken}&url=${encodeURIComponent(targetUrl)}`;

            const msgDiv = document.getElementById("status-msg");
            msgDiv.style.color = "var(--neon-gold)";
            msgDiv.innerText = "Generating Link...";
            showToast("Generating Access Link...");
            
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success" && data.shortenedUrl) {
                        window.location.href = data.shortenedUrl;
                    } else {
                        msgDiv.style.color = "#ff4444";
                        msgDiv.innerText = "Error generating link!";
                        showToast("Error generating link!");
                    }
                })
                .catch(() => {
                    msgDiv.style.color = "#ff4444";
                    msgDiv.innerText = "Network Error!";
                    showToast("Network Error!");
                });
        }

        function verifyUserKey() {
            const userKey = document.getElementById("accessKeyInput").value.trim();
            const msgDiv = document.getElementById("status-msg");
            const lengthErrorMsg = "⚠️ Invalid code! Please enter the right code";
            const usedErrorMsg = "⚠️ Invalid code! This key has already been used. Please get a new key.";
            const successMsg = "Portal Unlocked Successfully!";

            if (userKey.length !== 30) {
                msgDiv.style.color = "#ff4444";
                msgDiv.innerText = lengthErrorMsg;
                showToast(lengthErrorMsg);
                return;
            }

            const storageKey = "used_key_" + userKey;
            const isAlreadyUsed = localStorage.getItem(storageKey);

            if (isAlreadyUsed) {
                msgDiv.style.color = "#ff4444";
                msgDiv.innerText = usedErrorMsg;
                showToast(usedErrorMsg);
                return;
            }

            localStorage.setItem(storageKey, "true");
            msgDiv.style.color = "#00ff66";
            msgDiv.innerText = successMsg;
            showToast(successMsg);

            setTimeout(() => {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainAppContent').style.display = 'block';
            }, 1000);
        }

        function toggleFavorite(appName, element) {
            const isFav = element.classList.toggle('favorited');
            if (isFav) {
                showToast("Added to Favorites");
            } else {
                showToast("Removed from Favorites");
            }
        }
    </script>
</body>
</html>
